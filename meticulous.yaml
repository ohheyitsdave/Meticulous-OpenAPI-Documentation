servers:
- url: http://{ipAddress}
  variables:
    ipAddress:
      default: localhost
      description: The IP address or hostname of the server
components:
  schemas:
    rate_a_shot:
      type: object
      properties:
        rating:
          type: string
    load_profile_from_json:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        stages:
          type: array
          items:
            type: string
          properties:
            '0':
              type: object
    save_profile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        stages:
          type: array
          items:
            type: string
          properties:
            '0':
              type: object
    update_settings:
      type: object
      properties:
        enable_sounds:
          type: boolean
        disallow_firmware_flashing:
          type: boolean
        disable_ui_features:
          type: boolean
        debug_shot_data_retention_days:
          type: number
        auto_start_shot:
          type: boolean
        auto_purge_after_shot:
          type: boolean
        partial_retraction:
          type: number
        heat_on_boot:
          type: boolean
        heating_timeout:
          type: number
        update_channel:
          type: string
        idle_screen:
          type: string
        reverse_scrolling:
          type: object
          properties:
            home:
              type: boolean
            keyboard:
              type: boolean
            menus:
              type: boolean
        allow_legacy_json:
          type: boolean
        allow_stage_skipping:
          type: boolean
        usb_mode:
          type: string
        timezone_sync:
          type: string
        time_zone:
          type: string
        allow_debug_sending:
          type: boolean
        ssh_enabled:
          type: boolean
        profile_order:
          type: array
          items:
            type: string
          properties:
            '0':
              type: string
            '1':
              type: string
            '2':
              type: string
            '3':
              type: string
            '4':
              type: string
        hostname_override:
          type: string
        get_accesory_data:
          type: boolean
    set_system_time:
      type: object
      properties:
        date:
          type: string
    set_backlight_brightness:
      type: object
      properties:
        brightness:
          type: number
          format: float
          description: Brightness level between 0.0 and 1.0
          example: 0.75
          minimum: 0.0
          maximum: 1.0
        interpolation:
          type: string
          description: Interpolation method for brightness transition
          example: curve
        animation_time:
          type: number
          format: float
          description: Animation duration in seconds
          example: 2
          minimum: 0
  requestBodies:
    rate_a_shot:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/rate_a_shot'
      description: ''
      required: true
    load_profile_from_json:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/load_profile_from_json'
      description: ''
      required: true
    save_profile:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/save_profile'
      description: ''
      required: true
    update_settings:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_settings'
      description: ''
      required: true
    set_system_time:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/set_system_time'
      description: ''
      required: true
    set_backlight_brightness:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/set_backlight_brightness'
      description: Request body for setting backlight brightness
      required: true
  securitySchemes: {}
